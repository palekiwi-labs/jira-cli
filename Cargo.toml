[package]
name = "jira-cli"
description = "CLI frontend for Jira"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "jira-cli"
path = "src/main.rs"

[lib]
name = "jira_cli"
path = "src/lib.rs"
